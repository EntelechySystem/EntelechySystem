[project]
name = "entelechy"
version = "0.0.8_alpha"
description = "生机系统（Entelechy System, ES）—— 面向通用人工智能探索的多子系统工程"
requires-python = ">=3.14"
dependencies = [
    "chardet>=5.2.0",
    "numpy>=2.3.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "relation-entity-component-system-kit>=0.2.0",
    "scene-kit>=0.2.0",
]

[project.optional-dependencies]
# torch 在 model_define.py 中为可选回退（无 torch 时自动退化为 NumPy 数组）
torch = ["torch>=2.7.1"]

[tool.uv.sources]
relation-entity-component-system-kit = { path = "../relation-entity-component-system", editable = true }
scene-kit = { path = "../scene-kit", editable = true }
